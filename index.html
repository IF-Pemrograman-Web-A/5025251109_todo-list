<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ToDo List</h1>
    </header>
    <main>
        <section>
            <ul></ul>
        </section>
        <aside>
            <h2>Add Task</h2>
            <form>
                <p>Date</p>
                <input type="date" required>
                <p>Task Name</p>
                <input type="text" required>
                <p>Time</p>
                <input type="time" required>
                
                <p>Notification Time</p>
                <input type="time" required>

                <p>Take Photo</p>
                <video id="kamera" width="100%" autoplay></video>
                <button type="button" id="btnSnap" style="margin-bottom: 10px;">Capture</button>
                <canvas id="kanvas" style="display: none;"></canvas>
                <img id="hasilFoto" style="display: none; width: 100%; margin-bottom: 10px;">

                <button type="submit">Save</button>
            </form>
            <button id="btnTema">Theme Change</button>
        </aside>
    </main>
    <footer>
        <p>Copyright Marveilleux</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
